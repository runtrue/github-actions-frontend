[package]
name = "runtrue-gha-import"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.94"
repository = "https://github.com/runtrue/github-actions-frontend"
readme = "README.md"
description = "Strict, fail-closed GitHub Actions workflow frontend for Runtrue"

[dependencies]
runtrue-compiler = { git = "https://github.com/runtrue/runtrue", rev = "0ff23cf70485260741473993156fca2d5a0c7a40" }
runtrue-lock = { git = "https://github.com/runtrue/runtrue", rev = "0ff23cf70485260741473993156fca2d5a0c7a40" }
runtrue-model = { git = "https://github.com/runtrue/runtrue", rev = "0ff23cf70485260741473993156fca2d5a0c7a40" }
runtrue-workflow-frontend = { git = "https://github.com/runtrue/runtrue", rev = "0ff23cf70485260741473993156fca2d5a0c7a40" }
runtrue-workflow-ast = { git = "https://github.com/runtrue/runtrue", rev = "0ff23cf70485260741473993156fca2d5a0c7a40" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml = "=0.9.34"
thiserror = "=1.0.61"
toml = "=0.8.23"

[dev-dependencies]
tempfile = "=3.10.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[workspace]
resolver = "2"
