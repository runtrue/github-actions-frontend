services:
  frontend:
    user: "${RUNTRUE_RUNTIME_UID:?run Runtrue bootstrap first}:${RUNTRUE_RUNTIME_GID:?run Runtrue bootstrap first}"
    image: "${RUNTRUE_GITHUB_PRODUCT_UI_IMAGE:-ghcr.io/runtrue/github-actions-frontend-ui@sha256:477eb289f97ca6535761f75b41f9ae57278edb3f1aa94e2ff47ac33869c13241}"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BACKEND_ORIGIN: http://server:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:${RUNTRUE_GITHUB_PRODUCT_UI_PORT:-3000}:3000"
    expose:
      - "3000"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/frontend-healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      server:
        condition: service_healthy
    networks:
      - control
