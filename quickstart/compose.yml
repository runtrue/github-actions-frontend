name: "${RUNTRUE_COMPOSE_PROJECT_NAME:-runtrue}"

x-service-security: &service-security
  user: "${RUNTRUE_RUNTIME_UID:?run quick-start.sh first}:${RUNTRUE_RUNTIME_GID:?run quick-start.sh first}"
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  ulimits:
    nofile:
      soft: 4096
      hard: 8192

services:
  action-admission:
    image: "${RUNTRUE_RUNNER_IMAGE:?run quick-start.sh first}"
    pull_policy: never
    container_name: "${RUNTRUE_ACTION_ADMISSION_CONTAINER:?run quick-start.sh first}"
    user: "${RUNTRUE_RUNTIME_UID:?run quick-start.sh first}:${RUNTRUE_RUNTIME_GID:?run quick-start.sh first}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -rf /var/lib/runtrue-igh-oci/podman-runtime /var/lib/runtrue-igh-oci/podman-tmp &&
        install -d -m 0700 /var/lib/runtrue-igh-oci/podman-home
        /var/lib/runtrue-igh-oci/podman-runtime
        /var/lib/runtrue-igh-oci/podman-tmp &&
        /usr/bin/podman --root /var/lib/runtrue-igh-oci/image-store info
        --format json >/dev/null &&
        exec /bin/sleep infinity
    environment:
      HOME: /var/lib/runtrue-igh-oci/podman-home
      TMPDIR: /var/lib/runtrue-igh-oci/podman-tmp
      XDG_RUNTIME_DIR: /var/lib/runtrue-igh-oci/podman-runtime
    privileged: true
    devices:
      - /dev/fuse:/dev/fuse:rwm
    network_mode: none
    read_only: true
    init: true
    pids_limit: 128
    mem_limit: 512m
    volumes:
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/autoscaler/runtime-assets/oci"
        target: /var/lib/runtrue-igh-oci
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  action-builder:
    image: ghcr.io/runtrue/github-actions-server:latest
    pull_policy: always
    user: "${RUNTRUE_RUNTIME_UID:?run quick-start.sh first}:${RUNTRUE_RUNTIME_GID:?run quick-start.sh first}"
    group_add:
      - "${RUNTRUE_DOCKER_GID:?run quick-start.sh first}"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        install -d -m 0700 /var/lib/runtrue-action-builder/docker-config
        if /usr/bin/docker buildx inspect "${RUNTRUE_REPOSITORY_ACTION_BUILDX_BUILDER:?run quick-start.sh first}" >/dev/null 2>&1 \
          && ! /usr/bin/docker buildx inspect "${RUNTRUE_REPOSITORY_ACTION_BUILDX_BUILDER:?run quick-start.sh first}" \
            | grep -Fq 'network="host"'; then
          /usr/bin/docker buildx rm "${RUNTRUE_REPOSITORY_ACTION_BUILDX_BUILDER:?run quick-start.sh first}" >/dev/null
        fi
        if ! /usr/bin/docker buildx inspect "${RUNTRUE_REPOSITORY_ACTION_BUILDX_BUILDER:?run quick-start.sh first}" >/dev/null 2>&1; then
          /usr/bin/docker buildx create \
            --name "${RUNTRUE_REPOSITORY_ACTION_BUILDX_BUILDER:?run quick-start.sh first}" \
            --driver docker-container \
            --driver-opt network=host >/dev/null
        fi
        /usr/bin/docker buildx inspect \
          "${RUNTRUE_REPOSITORY_ACTION_BUILDX_BUILDER:?run quick-start.sh first}" --bootstrap >/dev/null
        exec /usr/local/bin/runtrue-action-builder \
          --socket /var/lib/runtrue-action-builder/builder.sock \
          --context-root /var/lib/runtrue-action-builder/source \
          --state-directory /var/lib/runtrue-action-builder/builds \
          --image-repository "${RUNTRUE_REPOSITORY_ACTION_IMAGE_REPOSITORY:-runtrue.local/repository-actions}" \
          --docker /usr/bin/docker \
          --buildx-builder "${RUNTRUE_REPOSITORY_ACTION_BUILDX_BUILDER:?run quick-start.sh first}" \
          --build-network default \
          --build-policy-id runtrue.repository-action-build.v3.network-default.pinned-materials \
          --build-environment-id runtrue.buildkit.v0.26.2.docker-container-host-network-driver.no-insecure-entitlements \
          --allowed-base-image "${RUNTRUE_REPOSITORY_ACTION_ALLOWED_BASE_IMAGES:?run quick-start.sh first}" \
          --admit-command /usr/local/bin/runtrue-action-admitter \
          --socket-gid "${RUNTRUE_RUNTIME_GID:?run quick-start.sh first}"
    environment:
      DOCKER_CONFIG: /var/lib/runtrue-action-builder/docker-config
      RUNTRUE_ACTION_ADMISSION_DOCKER: /usr/bin/docker
      RUNTRUE_ACTION_ADMISSION_MANIFEST_DIRECTORY: /var/lib/runtrue-igh-oci/manifests
      RUNTRUE_ACTION_ADMISSION_PODMAN_ROOT: /var/lib/runtrue-igh-oci/image-store
      RUNTRUE_ACTION_ADMISSION_RUNNER_CONTAINER: "${RUNTRUE_ACTION_ADMISSION_CONTAINER:?run quick-start.sh first}"
      RUNTRUE_ACTION_ADMISSION_RUNTIME_GID: "${RUNTRUE_RUNTIME_GID:?run quick-start.sh first}"
      RUNTRUE_ACTION_ADMISSION_RUNTIME_UID: "${RUNTRUE_RUNTIME_UID:?run quick-start.sh first}"
      RUNTRUE_ACTION_ADMISSION_SIGNATURE_IDENTITY: "local-image@${RUNTRUE_PUBLIC_HOST:?run quick-start.sh first}"
      RUNTRUE_ACTION_ADMISSION_SIGNING_KEY: /run/runtrue-action-admission/image-signing.key
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - scm-egress
    read_only: true
    init: true
    pids_limit: 512
    mem_limit: 2g
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/repository-actions/builder"
        target: /var/lib/runtrue-action-builder
        bind:
          create_host_path: false
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: "${RUNTRUE_DOCKER_BINARY:?run quick-start.sh first}"
        target: /usr/bin/docker
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_DOCKER_BUILDX_PLUGIN:?run quick-start.sh first}"
        target: /usr/libexec/docker/cli-plugins/docker-buildx
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/repository-actions/image-signing.key"
        target: /run/runtrue-action-admission/image-signing.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/autoscaler/runtime-assets/oci/manifests"
        target: /var/lib/runtrue-igh-oci/manifests
        bind:
          create_host_path: false
    depends_on:
      action-admission:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/lib/runtrue-action-builder/builder.sock"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  github-signer:
    <<: *service-security
    image: ghcr.io/runtrue/github-app-signer:latest
    pull_policy: always
    environment:
      RUNTRUE_GITHUB_SIGNER_SOCKET: /run/runtrue-github-signer/signer.sock
      RUNTRUE_GITHUB_APP_PRIVATE_KEY_FILE: /run/runtrue-private/github-app-private-key.pem
      RUNTRUE_GITHUB_APP_ID: "${RUNTRUE_GITHUB_APP_ID:?run quick-start.sh first}"
      RUNTRUE_GITHUB_APP_CREDENTIAL_REFERENCE: "${RUNTRUE_GITHUB_APP_CREDENTIAL_REFERENCE:?run quick-start.sh first}"
    volumes:
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/github-app-provider/private-key.pem"
        target: /run/runtrue-private/github-app-private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/github-app-provider"
        target: /run/runtrue-github-signer
        bind:
          create_host_path: false
    network_mode: none
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "/usr/local/bin/runtrue-github-signer", "--check-socket", "/run/runtrue-github-signer/signer.sock"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  server:
    <<: *service-security
    image: ghcr.io/runtrue/github-actions-server:latest
    pull_policy: always
    environment:
      RUNTRUE_LISTEN: 0.0.0.0:8080
      RUNTRUE_DATABASE: /var/lib/runtrue/server/control-plane.sqlite
      RUNTRUE_DATA_ROOT: /var/lib/runtrue/server/blobs
      RUNTRUE_GIT_MIRROR_ROOT: /var/lib/runtrue/server/git-mirrors
      RUNTRUE_INSTALLATION_ID: "${RUNTRUE_INSTALLATION_ID:?set RUNTRUE_INSTALLATION_ID}"
      RUNTRUE_BOOTSTRAP_TOKEN_FILE: /run/runtrue-secrets/bootstrap.token
      RUNTRUE_SECURITY_KEY_FILE: /run/runtrue-keys/security.key
      RUNTRUE_BROWSER_COOKIE_SEALING_KEY_FILE: /run/runtrue-secrets/browser-cookie.key
      RUNTRUE_PUBLIC_ORIGIN: "${RUNTRUE_PUBLIC_ORIGIN:?run quick-start.sh first}"
      RUNTRUE_OIDC_ISSUER: "${RUNTRUE_PUBLIC_ORIGIN:?run quick-start.sh first}/oidc"
      RUNTRUE_GITHUB_WEB_ORIGIN: "${RUNTRUE_GITHUB_WEB_ORIGIN:?run quick-start.sh first}"
      RUNTRUE_GITHUB_API_ORIGIN: "${RUNTRUE_GITHUB_API_ORIGIN:?run quick-start.sh first}"
      RUNTRUE_GITHUB_APP_ID: "${RUNTRUE_GITHUB_APP_ID:?run quick-start.sh first}"
      RUNTRUE_GITHUB_APP_SLUG: "${RUNTRUE_GITHUB_APP_SLUG:?run quick-start.sh first}"
      RUNTRUE_GITHUB_APP_CREDENTIAL_REFERENCE: "${RUNTRUE_GITHUB_APP_CREDENTIAL_REFERENCE:?run quick-start.sh first}"
      RUNTRUE_GITHUB_APP_JWT_PROVIDER_SOCKET: /run/runtrue-github-signer/signer.sock
      RUNTRUE_GITHUB_WEBHOOK_SECRET_FILE: /run/runtrue-secrets/github-webhook.secret
      RUNTRUE_GITHUB_OAUTH_CLIENT_ID: "${RUNTRUE_GITHUB_OAUTH_CLIENT_ID:?run quick-start.sh first}"
      RUNTRUE_GITHUB_OAUTH_CLIENT_SECRET_FILE: /run/runtrue-secrets/github-oauth-client.secret
      RUNTRUE_GITHUB_OAUTH_ADMIN_USER_IDS: "${RUNTRUE_GITHUB_OAUTH_ADMIN_USER_IDS:?run quick-start.sh first}"
      RUNTRUE_GITHUB_OAUTH_OPERATOR_USER_IDS: "${RUNTRUE_GITHUB_OAUTH_OPERATOR_USER_IDS:-}"
      RUNTRUE_SCM_WORKFLOW_DIRECTORY: .github/workflows
      RUNTRUE_REPOSITORY_ACTION_BUILDER_SOCKET: /var/lib/runtrue-action-builder/builder.sock
      RUNTRUE_REPOSITORY_ACTION_CONTEXT_ROOT: /var/lib/runtrue-action-builder/source
      RUNTRUE_RUNNER_GRPC_LISTEN: 0.0.0.0:8443
      RUNTRUE_RUNNER_ENROLLMENT_LISTEN: 0.0.0.0:8444
      RUNTRUE_RUNNER_TLS_CERTIFICATE: /run/runtrue-tls/runner-server.pem
      RUNTRUE_RUNNER_TLS_PRIVATE_KEY: /run/runtrue-tls/runner-server.key
      RUNTRUE_RUNNER_CA_CERTIFICATE: /run/runtrue-tls/runner-ca.pem
      RUNTRUE_RUNNER_CA_PRIVATE_KEY: /run/runtrue-tls/runner-ca.key
    expose:
      - "8080"
      - "8443"
      - "8444"
    volumes:
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/server"
        target: /var/lib/runtrue/server
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/repository-actions/builder"
        target: /var/lib/runtrue-action-builder
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/secrets"
        target: /run/runtrue-secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/keys"
        target: /run/runtrue-keys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/github-app-provider"
        target: /run/runtrue-github-signer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/tls"
        target: /run/runtrue-tls
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /run:size=16m,mode=0755,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "/usr/bin/timeout", "3", "/usr/local/bin/runtrue-healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2.0
    depends_on:
      action-builder:
        condition: service_healthy
      github-signer:
        condition: service_healthy
    networks:
      - control
      - scm-egress

  frontend:
    <<: *service-security
    image: ghcr.io/runtrue/github-actions-frontend-ui:latest
    pull_policy: always
    environment:
      BACKEND_ORIGIN: http://server:8080
      PORT: "3000"
    expose:
      - "3000"
    labels:
      - "traefik.enable=${RUNTRUE_TRAEFIK_DOCKER_ENABLED:-false}"
      - "traefik.docker.network=${RUNTRUE_EDGE_NETWORK_NAME:?run quick-start.sh first}"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}-http.rule=Host(`${RUNTRUE_PUBLIC_HOST:?run quick-start.sh first}`)"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}-http.entrypoints=${RUNTRUE_TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}-http.middlewares=${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}-https-redirect"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}-http.service=noop@internal"
      - "traefik.http.middlewares.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.rule=Host(`${RUNTRUE_PUBLIC_HOST:?run quick-start.sh first}`)"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.entrypoints=${RUNTRUE_TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.service=${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.tls=true"
      - "traefik.http.routers.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.tls.certresolver=${RUNTRUE_TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.loadbalancer.server.port=3000"
      - "traefik.http.services.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.loadbalancer.healthcheck.path=/frontend-healthz"
      - "traefik.http.services.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.${RUNTRUE_TRAEFIK_ROUTER_NAME:?run quick-start.sh first}.loadbalancer.healthcheck.timeout=3s"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/frontend-healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      server:
        condition: service_healthy
    networks:
      control:
      edge:
        aliases:
          - "${RUNTRUE_EDGE_UPSTREAM_NAME:?run quick-start.sh first}"

  autoscaler:
    image: "${RUNTRUE_AUTOSCALER_IMAGE:-ghcr.io/runtrue/runtrue-autoscaler:latest}"
    pull_policy: always
    user: "${RUNTRUE_RUNTIME_UID:?run quick-start.sh first}:${RUNTRUE_RUNTIME_GID:?run quick-start.sh first}"
    group_add:
      - "${RUNTRUE_DOCKER_GID:?run quick-start.sh first}"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      RUNTRUE_AUTOSCALER_CONTROL_PLANE: http://server:8080
      RUNTRUE_AUTOSCALER_POOL_ID: "${RUNTRUE_AUTOSCALER_POOL_ID:?run quick-start.sh first}"
      RUNTRUE_AUTOSCALER_TOKEN_FILE: /run/runtrue-secrets/autoscaler.token
      RUNTRUE_AUTOSCALER_DOCKER_TEMPLATE_FILE: /run/runtrue-autoscaler/docker-template.json
      RUNTRUE_AUTOSCALER_CLAIM_ROOT: "${RUNTRUE_AUTOSCALER_CLAIM_ROOT:?run quick-start.sh first}"
      RUNTRUE_AUTOSCALER_TRUST_ROOT: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}"
      RUNTRUE_AUTOSCALER_OWNER_ID: quickstart-docker
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: "${RUNTRUE_AUTOSCALER_CLAIM_ROOT:?run quick-start.sh first}"
        target: "${RUNTRUE_AUTOSCALER_CLAIM_ROOT:?run quick-start.sh first}"
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/runner-secrets/autoscaler.token"
        target: /run/runtrue-secrets/autoscaler.token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/autoscaler/docker-template.json"
        target: /run/runtrue-autoscaler/docker-template.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -d "$${RUNTRUE_AUTOSCALER_CLAIM_ROOT}" &&
          test -r "$${RUNTRUE_AUTOSCALER_TOKEN_FILE}" &&
          test -r "$${RUNTRUE_AUTOSCALER_DOCKER_TEMPLATE_FILE}" &&
          kill -0 1
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    networks:
      - control

  traefik:
    profiles: [bundled-traefik]
    image: docker.io/library/traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    user: "${RUNTRUE_RUNTIME_UID:?run quick-start.sh first}:${RUNTRUE_RUNTIME_GID:?run quick-start.sh first}"
    entrypoint: ["/bin/sh", "/var/lib/traefik/entrypoint.sh"]
    command:
      - --api.dashboard=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --ping=true
      - --ping.entrypoint=web
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
      - --providers.file.filename=/run/runtrue-traefik/dynamic.yml
      - --providers.file.watch=false
      - --certificatesresolvers.letsencrypt.acme.email=${RUNTRUE_ACME_EMAIL:-unused@example.invalid}
      - --certificatesresolvers.letsencrypt.acme.storage=/var/lib/traefik/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    environment:
      RUNTRUE_PUBLIC_ORIGIN: "${RUNTRUE_PUBLIC_ORIGIN:?run quick-start.sh first}"
      RUNTRUE_EDGE_UPSTREAM: "http://${RUNTRUE_EDGE_UPSTREAM_NAME:?run quick-start.sh first}:3000"
      RUNTRUE_EDGE_HEALTH_PATH: /frontend-healthz
    ports:
      - "${RUNTRUE_EDGE_HTTP_PORT:-80}:8080"
      - "${RUNTRUE_EDGE_HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: "${RUNTRUE_STATE_DIR:?run quick-start.sh first}/traefik"
        target: /var/lib/traefik
        bind:
          create_host_path: false
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /run/runtrue-traefik:size=1m,mode=0700,noexec,nosuid,nodev,uid=${RUNTRUE_RUNTIME_UID},gid=${RUNTRUE_RUNTIME_GID}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge

networks:
  control:
    internal: true
    driver: bridge
  scm-egress:
    driver: bridge
  edge:
    name: "${RUNTRUE_EDGE_NETWORK_NAME:?run quick-start.sh first}"
    external: ${RUNTRUE_EDGE_NETWORK_EXTERNAL:-false}
